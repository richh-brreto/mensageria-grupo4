version: '3.8'

services:
  mensageria-grupo4:
    image: rafael244/mensageria:1.0.1
    container_name: mensageria-grupo4
    ports:
      - "8081:8080"
    environment:
      RABBITMQ_HOST: boost-rabbitmq   # Nome exato do container do RabbitMQ
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-boost}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-boost}
    networks:
      - rede-boost
    restart: unless-stopped

networks:
  rede-boost:
    external: true  # Conecta à mesma rede externa