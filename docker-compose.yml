services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mensageria:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mensageria
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-mensageria.aula.exchange}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-mensageria.aula.queue}
      RABBITMQ_ROUTING_KEY: ${RABBITMQ_ROUTING_KEY:-mensageria.aula.routing}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      WHATSAPP_REMETENTE: ${WHATSAPP_REMETENTE:-}
      WHATSAPP_MESSAGING_SERVICE_SID: ${WHATSAPP_MESSAGING_SERVICE_SID:-}
      WHATSAPP_CONTENT_SID: ${WHATSAPP_CONTENT_SID:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
