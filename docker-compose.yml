version: '3.8'

services:

  mensageria-grupo4:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mensageria-grupo4
    depends_on:
      - rabbitmq
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: boost
      RABBITMQ_PASSWORD: boost
    networks:
      - mensageria-net
    restart: unless-stopped

networks:
  mensageria-net:
    driver: bridge
